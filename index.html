    // auto-update: force a fresh load when a newer version is deployed (defeats stale mobile caches)
    (function () {
      var V = 173;
      try {
        fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .then(function (t) {
            var latest = parseInt((t || "").trim(), 10);
            if (latest && latest > V && sessionStorage.getItem("fmv") !== String(latest)) {
              sessionStorage.setItem("fmv", String(latest));
              location.replace(location.pathname + "?u=" + latest);
            }
          }).catch(function () {});
      } catch (e) {}
    })();
  </script>

    .dl-banner { position: fixed; top: 0; left: 0; right: 0; z-index: 9999; display: flex; align-items: center; gap: 10px;

    .dl-banner .dl-btn { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.96); color: #d6336c; text-decoration: none;

    .dl-banner .dl-btn[hidden] { display: none; }

    /* ===== branded launch animation ===== */
    #launch { position: fixed; inset: 0; z-index: 100000; display: grid; place-items: center;
      background: radial-gradient(130% 120% at 50% 18%, #2a1016 0%, #14090d 42%, #0e0f13 100%);
      transition: opacity .55s ease, visibility .55s; }
    #launch.gone { opacity: 0; visibility: hidden; pointer-events: none; }
    #launch .la-inner { text-align: center; animation: laUp .8s cubic-bezier(.2,.8,.2,1) both; }
    #launch .la-mark { width: 92px; height: 92px; filter: drop-shadow(0 10px 34px rgba(255,90,80,.55));
      animation: laPop 1s cubic-bezier(.2,.9,.25,1.25) both; }
    #launch .la-name { font-family: Outfit, system-ui, sans-serif; font-weight: 800; font-size: 34px;
      letter-spacing: 4px; color: #fff; margin-top: 16px; }
    #launch .la-name span { background: linear-gradient(135deg,#ff9d4d,#ff3d7f); -webkit-background-clip: text; background-clip: text; color: transparent; }
    #launch .la-tag { font-family: Outfit, sans-serif; color: #ff9d7a; font-size: 12px; letter-spacing: 3px;
      text-transform: uppercase; margin-top: 8px; opacity: 0; animation: laFade .7s ease .45s forwards; }
    #launch .la-bar { width: 118px; height: 3px; border-radius: 999px; margin: 20px auto 0;
      background: rgba(255,255,255,.14); overflow: hidden; }
    #launch .la-bar i { display: block; height: 100%; width: 40%; border-radius: 999px;
      background: linear-gradient(90deg,#ff9d4d,#ff3d7f); animation: laLoad 1.4s ease-in-out infinite; }
    @keyframes laPop { 0%{transform:scale(.4) rotate(-14deg);opacity:0} 55%{opacity:1} 100%{transform:scale(1) rotate(0);opacity:1} }
    @keyframes laUp { from{transform:translateY(16px);opacity:0} to{transform:translateY(0);opacity:1} }
    @keyframes laFade { to{opacity:.9} }
    @keyframes laLoad { 0%{transform:translateX(-120%)} 100%{transform:translateX(320%)} }
    @media (prefers-reduced-motion: reduce){ #launch .la-inner,#launch .la-mark,#launch .la-tag{animation-duration:.01ms} #launch .la-bar i{animation:none;width:100%} }

    /* ===== mode-switch transition (slide-to-confirm -> enter a mode) ===== */
    .mode-switch { position: fixed; inset: 0; z-index: 10000; display: grid; place-items: center;
      background: radial-gradient(130% 120% at 50% 40%, #2a1016 0%, #14090d 45%, #0e0f13 100%); animation: msIn .26s ease both; }
    .mode-switch.out { animation: msOut .34s ease forwards; }
    .mode-switch .ms-inner { text-align: center; animation: msPop .5s cubic-bezier(.2,.85,.25,1.1) both; }
    .mode-switch .ms-ring { width: 96px; height: 96px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; position: relative; overflow: hidden;
      background: linear-gradient(135deg, rgba(255,157,77,.22), rgba(255,61,127,.16)); box-shadow: 0 14px 44px rgba(255,90,77,.42); }
    .mode-switch .ms-ring::after { content: ""; position: absolute; inset: 0; background: linear-gradient(120deg, transparent 32%, rgba(255,255,255,.4), transparent 68%); transform: translateX(-120%); animation: msSweep .7s .12s ease forwards; }
    .mode-switch .ms-ring svg { color: #fff; filter: drop-shadow(0 4px 14px rgba(255,90,77,.6)); position: relative; z-index: 1; }
    .mode-switch .ms-label { margin-top: 18px; font-family: Outfit, system-ui, sans-serif; font-weight: 800; font-size: 25px; letter-spacing: .5px;
      background: linear-gradient(135deg,#ff9d4d,#ff3d7f); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .mode-switch .ms-sub { color: #ff9d7a; font-size: 11px; letter-spacing: 3px; text-transform: uppercase; margin-top: 7px; opacity: 0; animation: laFade .5s ease .3s forwards; }
    .mode-switch .ms-bar { width: 120px; height: 3px; border-radius: 999px; margin: 20px auto 0; background: rgba(255,255,255,.14); overflow: hidden; }
    .mode-switch .ms-bar i { display: block; height: 100%; width: 0; border-radius: 999px; background: linear-gradient(90deg,#ff9d4d,#ff3d7f); animation: msBar .6s .05s cubic-bezier(.4,0,.2,1) forwards; }
    @keyframes msIn { from{opacity:0} to{opacity:1} }
    @keyframes msOut { from{opacity:1} to{opacity:0} }
    @keyframes msPop { 0%{opacity:0;transform:scale(.82) translateY(12px)} 60%{opacity:1;transform:scale(1.04)} 100%{transform:scale(1) translateY(0)} }
    @keyframes msSweep { to{transform:translateX(120%)} }
    @keyframes msBar { to{width:100%} }
    @media (prefers-reduced-motion: reduce){ .mode-switch .ms-inner{animation-duration:.01ms} .mode-switch .ms-ring::after,.mode-switch .ms-bar i{animation:none} }

    /* ============================================================
       PREMIUM TIER THEMING (Free / Pro / Elite)
       The ENTIRE app re-themes by overriding --accent/--accent2 (which drive every
       gradient, button, ring, nav accent + focus ring across styles.css). Bare
       attribute selectors (not html-scoped) so a profile modal can also show ANOTHER
       member's tier locally. Free = signature orange→pink · Pro = violet→magenta ·
       Elite = champagne gold. ============================================================ */
    :root { --tier-accent: #ff9d4d; --tier-accent2: #ff3d7f; }
    [data-tier="pro"]   { --accent: #9b6bff; --accent2: #ff5aa0; --tier-accent: #b98cff; --tier-accent2: #ff5aa0; }
    [data-tier="elite"] { --accent: #d99f2b; --accent2: #f7cf6b; --tier-accent: #f7cf6b; --tier-accent2: #cf9020; }
    /* Elite gold is light → filled accents get dark ink so text stays legible (white-on-gold fails contrast) */
    html[data-tier="elite"] .btn:not(.ghost):not(.icon-btn),
    html[data-tier="elite"] .btn-big.go, html[data-tier="elite"] .ut.active,
    html[data-tier="elite"] .exp-chip.active, html[data-tier="elite"] .diet-toggle button.active,
    html[data-tier="elite"] .cuisine-chip.active, html[data-tier="elite"] .ssub.active,
    html[data-tier="elite"] .pw-tab.active, html[data-tier="elite"] .pt-badge,
    html[data-tier="elite"] .pro-tag,
    .view-profile[data-tier="elite"] .btn:not(.ghost),
    .member-card[data-tier="elite"] .btn:not(.ghost) { color: #2a1c05; }
    html[data-tier="elite"] .sb-thumb { color: #b6841f; }
    /* slide label stays LIGHT on its dark track (it is NOT on the accent fill); shadow keeps it legible where the fill passes under */
    .sb-label { text-shadow: 0 1px 3px rgba(0,0,0,.55); }
    /* ambient background glow follows the tier */
    html[data-tier="pro"] .bg-glow { background:
      radial-gradient(600px 400px at 15% -5%, rgba(155,107,255,.20), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(61,139,255,.12), transparent 55%),
      radial-gradient(600px 600px at 50% 120%, rgba(255,90,160,.14), transparent 60%); }
    html[data-tier="elite"] .bg-glow { background:
      radial-gradient(600px 400px at 15% -5%, rgba(230,170,60,.09), transparent 60%),
      radial-gradient(700px 500px at 100% 0%, rgba(120,90,255,.05), transparent 55%),
      radial-gradient(600px 600px at 50% 120%, rgba(230,160,40,.06), transparent 60%); }
