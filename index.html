  <script>
    (function () {
      var IOS_APPSTORE_URL = ""; // set once the iOS app is on the App Store/TestFlight; empty => "coming soon"
      if (window.Capacitor) return;                       // already inside the native app
      try { if (localStorage.getItem("fm_dl_x") === "1") return; } catch (e) {}
      var ua = navigator.userAgent || "";
      var isAndroid = /Android/i.test(ua);
      var isIOS = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
      var banner = document.getElementById("dl-banner"), aA = document.getElementById("dl-android"), aI = document.getElementById("dl-ios");
      function showIOS() {
        aI.hidden = false;
        var lbl = aI.querySelector(".lbl");
        if (IOS_APPSTORE_URL) { aI.href = IOS_APPSTORE_URL; if (lbl) lbl.textContent = "App Store"; }
        else { if (lbl) lbl.textContent = "Install"; aI.href = "javascript:void 0"; aI.onclick = function () { alert("Install Formora on your iPhone \u2014 no App Store needed:\n\n1. Tap the Share button in Safari (the square with an up-arrow)\n2. Scroll down and choose \"Add to Home Screen\"\n\nIt then opens full-screen, just like a native app."); return false; }; }
      }
      if (isAndroid) { aA.hidden = false; }
      else if (isIOS) { showIOS(); }
      else { aA.hidden = false; showIOS(); }              // desktop: offer both
      banner.hidden = false;
      document.getElementById("dl-x").onclick = function () { banner.hidden = true; try { localStorage.setItem("fm_dl_x", "1"); } catch (e) {} };
    })();

    // Camera is code-split: ~30KB module (js/mod/camera.js) is loaded ON DEMAND the first time the in-app camera opens, keeping the initial payload small. CameraLoader is a tiny always-present shim.
    window.CameraLoader = {
      _p: null,
      supported: function () { return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder); },
      ensure: function () {
        if (typeof Camera !== "undefined") return Promise.resolve();
        if (this._p) return this._p;
        this._p = new Promise(function (res, rej) {
          var s = document.createElement("script");
          s.src = "js/mod/camera.js?v=147";
          s.onload = res; s.onerror = rej;
          document.head.appendChild(s);
        });
        return this._p;
      },
      open: function (t) {
        return this.ensure().then(function () { if (typeof Camera !== "undefined") return Camera.open(t); })
          .catch(function () { if (typeof App !== "undefined" && App.toast) App.toast("Couldn't load the camera — check your connection and try again."); else alert("Couldn't load the camera — check your connection and try again."); });
