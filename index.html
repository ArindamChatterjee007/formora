<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formora · Your Aesthetic Physique Coach</title>
  <script>
    // auto-update: force a fresh load when a newer version is deployed (defeats stale mobile caches)
    (function () {
      var V = 38;
      try {
        fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .then(function (t) {
            var latest = parseInt((t || "").trim(), 10);
            if (latest && latest > V && sessionStorage.getItem("fmv") !== String(latest)) {
              sessionStorage.setItem("fmv", String(latest));
              location.replace(location.pathname + "?u=" + latest);
            }
          }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=38" />
</head>
<body>
  <!-- animated background -->
  <div class="bg-sky"></div>
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="bg-glow"></div>
  <div class="bg-particles"></div>

  <!-- ===== AUTH GATE ===== -->
  <div class="auth-overlay" id="auth-overlay">
    <div class="auth-card" id="auth-card"><!-- rendered by JS --></div>
  </div>

  <div id="app-shell" class="app-shell hidden">
  <header class="topbar">
    <div class="logo">
      <span class="logo-mark">⟡</span>
      <div>
        <div class="logo-name">FORM<span>ORA</span></div>
        <div class="logo-sub">aesthetic physique coach</div>
      </div>
    </div>
    <div class="topbar-right">
      <span class="chip sky" id="sky-chip"></span>
      <span class="chip" id="chip-streak">🔥 0d</span>
    </div>
  </header>

  <nav class="tabbar" id="tabbar">
    <button class="tab active" data-tab="home"><i>🏠</i><span>Home</span></button>
    <button class="tab" data-tab="search"><i>🔍</i><span>Search</span></button>
    <button class="tab" data-tab="coach"><i>💪</i><span>Coach</span></button>
    <button class="tab" data-tab="alerts"><i>🔔</i><span>Alerts</span><b class="tab-badge" id="tab-notif-badge" style="display:none">0</b></button>
    <button class="tab" data-tab="profile"><i>👤</i><span>Profile</span></button>
  </nav>

  <main class="wrap" id="wrap">
    <!-- ===== HOME = FEED (social) ===== -->
    <section class="view active" id="view-feed"></section>
    <!-- ===== COACH HUB (dashboard + today + progress + nutrition) ===== -->
    <section class="view" id="view-coach">
      <div class="social-subnav coach-subnav" id="coach-subnav"></div>
      <div id="view-home"></div>
      <div id="view-today"></div>
      <div id="view-progress"></div>
      <div id="view-nutrition"></div>
    </section>
    <!-- ===== ALERTS (notifications) ===== -->
    <section class="view" id="view-alerts"></section>
    <!-- ===== PROFILE ===== -->
    <section class="view" id="view-profile"></section>
  </main>

  <footer class="foot">Formora · Train. Track. Connect.</footer>
  </div><!-- /app-shell -->
  <!-- ===== MODAL (physique picker) ===== -->
  <div class="modal-overlay hidden" id="modal">
    <div class="modal-card" id="modal-card"></div>
  </div>

  <script src="js/config.js?v=38"></script>
  <script src="js/data.js?v=38"></script>
  <script src="js/storage.js?v=38"></script>
  <script src="js/engine.js?v=38"></script>
  <script src="js/charts.js?v=38"></script>
  <script src="js/nutrition.js?v=38"></script>
  <script src="js/auth.js?v=38"></script>
  <script src="js/social.js?v=38"></script>
  <script src="js/cloud.js?v=38"></script>
  <script src="js/app.js?v=38"></script>
</body>
</html>
