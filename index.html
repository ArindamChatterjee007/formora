<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formora · Your Aesthetic Physique Coach</title>
  <script>
    // auto-update: force a fresh load when a newer version is deployed (defeats stale mobile caches)
    (function () {
      var V = 70;
      try {
        fetch("version.txt?t=" + Date.now(), { cache: "no-store" })
          .then(function (r) { return r.ok ? r.text() : ""; })
          .then(function (t) {
            var latest = parseInt((t || "").trim(), 10);
            if (latest && latest > V && sessionStorage.getItem("fmv") !== String(latest)) {
              sessionStorage.setItem("fmv", String(latest));
              location.replace(location.pathname + "?u=" + latest);
            }
          }).catch(function () {});
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/styles.css?v=70" />
</head>

  <header class="topbar">

      <div>
        <div class="logo-name">FORM<span>ORA</span></div>

  </nav>

  <main class="wrap" id="wrap">
    <!-- ===== HOME = FEED (social) ===== -->

    <!-- ===== ALERTS (notifications) ===== -->
    <section class="view" id="view-alerts"></section>
    <!-- ===== PROFILE ===== -->
    <section class="view" id="view-profile"></section>
  </main>

  <footer class="foot">Formora · Train. Track. Connect.</footer>
  </div><!-- /app-shell -->
